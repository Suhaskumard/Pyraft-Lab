[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyraft-lab"
version = "0.1.0"
description = "A Raft-based fault-tolerant distributed KV store with a deterministic fault-injection laboratory"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=12",
]

[project.scripts]
pyraft-lab = "pyraft_lab.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pyraft_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running scenario or property test",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
