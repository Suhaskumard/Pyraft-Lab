# Tolerance to high latency. 60ms +/- 20ms one way, so a heartbeat round trip costs
# ~120-160ms against a 150-300ms election timeout: comfortably slower, not hopeless.
#
# The specification's own example writes 200ms/50ms here. That is past this cluster's
# breaking point rather than inside its tolerance - two 200ms hops exceed the minimum
# election timeout, so followers time out before a heartbeat can reach them and the
# cluster campaigns forever. Recorded here rather than quietly ignored: the number that
# demonstrates tolerance has to be one the system can actually tolerate, and finding
# where that boundary sits is what the laboratory is for.
name: network_latency
duration: 30s
nodes: 5
seed: 5

faults:
  - type: link_config
    latency_ms: 60
    jitter_ms: 20
    start: 0s

workload:
  type: put_get_mix
  puts_per_sec: 10
  get_ratio: 0.5
  keys: 4
  clients: 2

expected:
  data_loss: false
  linearizable: true
